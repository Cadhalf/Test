<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        /* ... (Your CSS remains the same) ... */
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            AI Assistant
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message ai-message">
                Hello! I am here to help you!
            </div>
        </div>
        <div class="typing-indicator" id="typing-indicator">Calculating Response</div>
        <div class="input-container">
            <input type="text" class="message-input" id="message-input" placeholder="Type your message...">
            <button class="send-btn" id="send-btn">Send</button>
        </div>
    </div>

    <script>
        class EnhancedAI {
            constructor() {
                // 🔑 API Key Insertion Point 🔑
                // **REPLACE THIS WITH YOUR ACTUAL API KEY**
                this.apiKey = "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"; 
                this.apiEndpoint = "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"; 
                // **SECURITY NOTE: NEVER DO THIS FOR PRODUCTION CODE**

                this.responses = {
                    // ... (Your static responses) ...
                    "hi": "Hello! How can I assist you today?",
                    "hello": "Hi there! What would you like to talk about?",
                    // ... (rest of your static responses) ...
                };
            }

            // This is the function you would modify to call a real AI API
            async fetchAIResponse(message) {
                // Check for your static responses first
                const staticResponse = this.generateStaticResponse(message);
                if (staticResponse) {
                    return staticResponse;
                }

                if (!this.apiKey || !this.apiEndpoint) {
                    return "I need a proper API key and endpoint to provide a real-time response.";
                }

                try {
                    // **EXAMPLE of an API call structure (you need to customize this)**
                    const response = await fetch(this.apiEndpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            // Most APIs use an Authorization header
                            'Authorization': `Bearer ${this.apiKey}` 
                        },
                        body: JSON.stringify({
                            model: "your-model-name", // e.g., "gemini-2.5-flash"
                            prompt: message 
                            // ... other parameters
                        })
                    });

                    const data = await response.json();
                    // You'll need to parse the response format of your chosen API
                    return data.text || "Sorry, I received an error from the AI model.";

                } catch (error) {
                    console.error("API Fetch Error:", error);
                    return "I ran into a technical issue while processing your request.";
                }
            }
            
            generateStaticResponse(message) {
                const lowercaseMsg = message.toLowerCase().trim();

                // Check for exact matches first (This is your original logic)
                for (let key in this.responses) {
                    if (lowercaseMsg.includes(key)) {
                        return this.responses[key];
                    }
                }
                // ... (rest of your original static response logic) ...

                // If no static response, return null to indicate the need for an API call
                return null; 
            }
        }

        class ChatInterface {
            constructor() {
                this.ai = new EnhancedAI();
                this.chatMessages = document.getElementById('chat-messages');
                this.messageInput = document.getElementById('message-input');
                this.sendBtn = document.getElementById('send-btn');
                this.typingIndicator = document.getElementById('typing-indicator');

                this.setupEventListeners();
                this.messageInput.focus();
            }

            setupEventListeners() {
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.sendMessage();
                });
            }

            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message) return;

                // Add user message
                this.addMessage(message, 'user');
                
                // Clear input and disable send button temporarily
                this.messageInput.value = '';
                this.sendBtn.disabled = true;
                
                // Show typing indicator
                this.showTypingIndicator();

                // Generate AI response - MODIFIED to use async API call
                const aiResponse = await this.ai.fetchAIResponse(message);

                // Simulate a minimum delay for the typing indicator if the response was instant
                await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 1000)); 

                this.hideTypingIndicator();
                this.addMessage(aiResponse, 'ai');
                this.sendBtn.disabled = false;
                this.messageInput.focus();
            }

            addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', `${sender}-message`);
                messageDiv.textContent = text;
                this.chatMessages.appendChild(messageDiv);
                
                // Auto-scroll to bottom
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            showTypingIndicator() {
                this.typingIndicator.style.display = 'block';
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            hideTypingIndicator() {
                this.typingIndicator.style.display = 'none';
            }
        }

        // Initialize chat interface when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ChatInterface();
        });
    </script>
</body>
</html>
